name: Guard

# Immutable-gates enforcement (TRIP-INTAKE-PLAN.md). Auto-merge-on-green is
# only as trustworthy as the gates a PR cannot rewrite — so any PR that
# touches the gates themselves (tests, workflows, schema, the validator, the
# dependency manifests) fails this check until a human signs off on it.
# PRs that touch none of those (e.g. generated trips: research doc + data
# module + page) pass instantly and stay auto-mergeable.
#
# Why pull_request_target: it always runs THIS file as it exists on the base
# branch. A PR that edits guard.yml is judged by main's copy, not its own —
# that is what makes the gate immutable from inside a PR. This job must never
# check out or execute PR code; it only reads the GitHub API.
#
# Clearing the gate. Either works:
#   - the repo owner approves the PR, naming the current head commit, or
#   - the "gates-reviewed" label is on the PR.
#
# The label exists because GitHub refuses to let an author approve their own
# PR. On a single-maintainer repo the owner authors every PR, so requiring
# *their* approval made this gate unsatisfiable — it could only ever be merged
# past, which trains everyone to ignore a red X. A label is an equally
# deliberate, equally auditable act that the author can actually perform.
#
# Label PRESENCE is not authorization — the triage role can apply labels
# without write access. So the check reads the timeline and requires that the
# most recent application of the label was by @owner; anyone else's is stripped
# and fails. An outside contributor therefore still cannot clear their own gate
# change, which is the case this guard was built for.
#
# Deliberately NOT accepted: an approving review from "anyone other than the
# author". On a public repo anyone can submit a review, so a fork contributor
# could clear their own gate change using a second throwaway account. Being
# someone other than the author is not a trust boundary; being the owner is.
#
# Both routes are pinned to the current head. An approval of an older commit
# does not count, and pushing after the label strips it — otherwise a sign-off
# silently covers protected-path changes nobody read.
#
# One-time setup that gives this teeth (repo Settings):
#   - Branch protection on main: require status checks "test", "smoke", "Guard".
#   - General → allow auto-merge.

on:
  pull_request_target:
    # labeled/unlabeled matter: without them, adding the ack label leaves this
    # check sitting red forever because nothing re-runs it.
    types:
      [
        opened,
        synchronize,
        reopened,
        ready_for_review,
        labeled,
        unlabeled,
      ]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  # write, not read: an ack that is stale or unauthorised is stripped, so a
  # sign-off cannot silently cover commits nobody reviewed. Labels on PRs go
  # through the issues API, hence both scopes. The job still never checks out
  # or executes PR code.
  pull-requests: write
  issues: write

jobs:
  guard:
    if: ${{ github.event.pull_request != null }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail if protected paths changed without a review or the ack label
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const ACK_LABEL = "gates-reviewed";
            const PROTECTED = [
              /^\.github\//,
              /^test\//,
              /^worker\/test\//,
              /^e2e\//,
              /^schema\//,
              /^scripts\//,
              /^src\/scripts\/validate\.js$/,
              /^playwright\.config\.mjs$/,
              /^astro\.config\.mjs$/,
              /^package(-lock)?\.json$/,
              /^worker\/package(-lock)?\.json$/,
            ];
            const files = await github.paginate(github.rest.pulls.listFiles,
              { owner, repo, pull_number: pr.number, per_page: 100 });
            const touched = files.map(f => f.filename).filter(n => PROTECTED.some(re => re.test(n)));
            if (touched.length === 0) {
              core.info("No protected paths touched — gates unchanged.");
              return;
            }
            const list = touched.join("\n");

            // Read state from the API, not context.payload: on a re-run, or on
            // a pull_request_review event, the payload can carry the labels and
            // head from whenever that event fired rather than the current ones.
            const { data: fresh } = await github.rest.pulls.get(
              { owner, repo, pull_number: pr.number });
            const head = fresh.head.sha;
            // A re-run of an old event: the payload describes a head that is no
            // longer current. Evaluate against the truth, but never mutate the
            // PR on the strength of a stale payload.
            const staleEvent = pr.head.sha !== head;
            const labelled = (fresh.labels || []).some(l => l.name === ACK_LABEL);

            const dropLabel = async (why) => {
              if (staleEvent) {
                core.setFailed(`${why}\n\n(Stale event — label left alone; re-run against the current head.)`);
                return;
              }
              try {
                await github.rest.issues.removeLabel(
                  { owner, repo, issue_number: pr.number, name: ACK_LABEL });
                core.setFailed(`${why}\n\nThe label has been removed.`);
              } catch (e) {
                core.setFailed(`${why}\n\n(Could not remove the label: ${e.message})`);
              }
            };

            if (labelled) {
              // An ack covers the diff the acker actually read. A later push can
              // add protected-path changes underneath a label still sitting
              // there, so a new head commit strips it and demands a fresh one.
              if (context.payload.action === "synchronize") {
                await dropLabel(
                  `New commits pushed after the "${ACK_LABEL}" ack, and this PR still ` +
                  `touches protected paths:\n${list}\n\nRe-read the diff and re-apply it.`,
                );
                return;
              }
              // Label PRESENCE is not authorization. The triage role can apply
              // labels without write access, so check who actually applied it —
              // only @owner's ack counts.
              const events = await github.paginate(github.rest.issues.listEvents,
                { owner, repo, issue_number: pr.number, per_page: 100 });
              const applied = events
                .filter(e => e.event === "labeled" && e.label && e.label.name === ACK_LABEL)
                .pop();
              const by = applied && applied.actor ? applied.actor.login : null;
              if (by === owner) {
                core.info(`Protected paths changed, acknowledged by @${owner} via the "${ACK_LABEL}" label:\n${list}`);
                return;
              }
              await dropLabel(
                `The "${ACK_LABEL}" label was applied by ${by ? "@" + by : "an unknown actor"}, ` +
                `not @${owner}. Applying a label only needs the triage role, so the label ` +
                `alone is not authorization for these changes:\n${list}`,
              );
              return;
            }

            // The review route stays deliberately narrow: an approval from the
            // repo owner, on the current head. It is NOT "any approving review"
            // — on a public repo anyone can submit one, so a fork contributor
            // could clear their own gate change with a second throwaway account.
            // Being someone other than the author is not a trust boundary.
            const reviews = await github.paginate(github.rest.pulls.listReviews,
              { owner, repo, pull_number: pr.number, per_page: 100 });
            const latest = new Map();
            for (const r of reviews) if (r.user) latest.set(r.user.login, r);
            const ownerReview = latest.get(owner);
            const author = (pr.user || {}).login;
            if (
              ownerReview &&
              ownerReview.state === "APPROVED" &&
              ownerReview.user.login !== author &&
              ownerReview.commit_id === head
            ) {
              core.info(`Protected paths changed with @${owner}'s approval of ${head}:\n${list}`);
              return;
            }

            core.setFailed(
              `Protected paths changed — auto-merge is blocked until these are reviewed:\n${list}\n\n` +
              `Clear it either way:\n` +
              `  • @${owner} approves the PR (the approval must name the current head, ${head.slice(0, 8)}), or\n` +
              `  • add the "${ACK_LABEL}" label once you have read the diff above.\n` +
              `GitHub does not let an author approve their own PR, so when @${owner} is ` +
              `also the author the label is the only route. Removing it, or pushing ` +
              `another commit, re-runs this check.`,
            );
