name: Trip intake

# Phase 2 of TRIP-INTAKE-PLAN.md: prove the spine end-to-end — the Worker's
# repository_dispatch lands here, the ledger issue gets progress comments, and
# a draft PR opens carrying the raw brief. Phase 3 replaces the stub step with
# the real hybrid generation (research script + deterministic template).
#
# repository_dispatch always runs THIS file as it exists on the default
# branch — a PR cannot substitute its own copy.

on:
  repository_dispatch:
    types: [trip-request]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  stub:
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge on the ledger issue, open the stub PR
        uses: actions/github-script@v7
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        with:
          script: |
            const p = JSON.parse(process.env.PAYLOAD);
            const { owner, repo } = context.repo;
            const footer = "\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_";

            await github.rest.issues.createComment({
              owner, repo, issue_number: p.issue,
              body: "Intake received the brief and the spine works — auth, quota, ledger, dispatch." +
                "\n\n```json\n" + JSON.stringify(p.brief, null, 2) + "\n```" +
                "\n_(Phase 2 stub — real generation lands in Phase 3.)_" + footer,
            });

            // The PR half of the spine: a branch with the raw request file.
            // Same path containment the real generator will be held to.
            const main = await github.rest.repos.getBranch({ owner, repo, branch: "main" });
            const branch = `intake/${p.slug}`;
            await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: main.data.commit.sha });
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, branch,
              path: `research/${p.slug}.request.json`,
              message: `Trip request: ${p.slug} (intake stub)`,
              content: Buffer.from(
                JSON.stringify({ request_id: p.request_id, requested_by: p.requested_by, brief: p.brief }, null, 2) + "\n",
              ).toString("base64"),
            });
            const pr = await github.rest.pulls.create({
              owner, repo, base: "main", head: branch, draft: true,
              title: `Trip request stub: ${p.slug}`,
              body: `The intake spine delivered this request end-to-end; this stub PR carries the raw brief for \`${p.slug}\`.\n\n` +
                `Phase 3 replaces it with the generated research doc, data module, and page — gated by the schema, the validator, and the full test suite.\n\n` +
                `Closes #${p.issue}\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)`,
            });
            await github.rest.issues.createComment({
              owner, repo, issue_number: p.issue,
              body: `Stub PR opened: ${pr.data.html_url}` + footer,
            });
